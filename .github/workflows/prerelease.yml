name: Daily Pre-Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # --------------------------------------------------------
  # Generate daily release tag (only once)
  # --------------------------------------------------------
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagger.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate daily tag
        id: tagger
        uses: GNITOAHC/daily-release-tag-action@v1

  # --------------------------------------------------------
  # Cross-platform build matrix
  # --------------------------------------------------------
  build:
    needs: tag
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        # Windows arm64 not built in Go toolchain yet
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build and package binary
        run: |
          VERSION="${{ needs.tag.outputs.tag }}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi

          # --------------
          # Build CLI
          # --------------
          cli_bin="codesfer$ext"

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o "$cli_bin" -ldflags "-s -w -X github.com/gnitoahc/codesfer/pkg/version.Version=$VERSION" ./cmd/codesfer/main.go

          if [ "${{ matrix.goos }}" = "windows" ]; then
            cli_archive="codesfer-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
            zip "$cli_archive" "$cli_bin"
          else
            cli_archive="codesfer-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
            tar -czf "$cli_archive" "$cli_bin"
          fi

          # --------------
          # Build server
          # --------------
          server_bin="codeserver$ext"

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o "$server_bin" -ldflags "-s -w -X github.com/gnitoahc/codesfer/pkg/version.Version=$VERSION" ./cmd/codesfer-server/main.go

          if [ "${{ matrix.goos }}" = "windows" ]; then
            server_archive="codeserver-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
            zip "$server_archive" "$server_bin"
          else
            server_archive="codeserver-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
            tar -czf "$server_archive" "$server_bin"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: codesfer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: codesfer-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeserver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: codeserver-${{ matrix.goos }}-${{ matrix.goarch }}*

  # --------------------------------------------------------
  # Release job (runs after all binaries finish)
  # --------------------------------------------------------
  release:
    needs: [build, tag]
    runs-on: ubuntu-latest

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: "Automated Cross-Platform Release ${{ needs.tag.outputs.tag }}"
          prerelease: true
          files: |
            dist/**/codesfer-*
            dist/**/codeserver-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

