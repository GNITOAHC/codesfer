name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # --------------------------------------------------------
  # Cross-platform build matrix
  # --------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build and package binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi

          # --------------
          # Build CLI
          # --------------
          cli_bin="codesfer$ext"
          cli_archive="codesfer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.gz"

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o "$cli_bin" -ldflags "-s -w -X codesfer/pkg/version.Version=$VERSION" ./cmd/codesfer/main.go

          gzip -c "$cli_bin" > "$cli_archive"

          # --------------
          # Build server
          # --------------
          server_bin="codeserver$ext"
          server_archive="codeserver-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.gz"

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -o "$server_bin" -ldflags "-s -w -X codesfer/pkg/version.Version=$VERSION" ./cmd/codesfer-server/main.go

          gzip -c "$server_bin" > "$server_archive"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: codesfer-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: codesfer-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeserver-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: codeserver-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  # --------------------------------------------------------
  # Release job (runs after all binaries finish)
  # --------------------------------------------------------
  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          prerelease: false
          files: |
            dist/**/codesfer-*
            dist/**/codeserver-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
